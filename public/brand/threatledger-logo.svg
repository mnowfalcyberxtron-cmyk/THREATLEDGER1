<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logoSilverOutline" x1="15" y1="15" x2="135" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="logoDarkInterior" x1="75" y1="20" x2="75" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <filter id="logoMintGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logoCenterGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Shield Mark -->
  <g transform="translate(20, 10) scale(0.65)">
    <!-- Shield Shadow -->
    <path
      d="M100 18 C135 18 175 26 175 26 C175 26 178 112 100 224 C22 112 25 26 25 26 C25 26 65 18 100 18 Z"
      fill="#000000"
      opacity="0.4"
      transform="translate(0, 4)"
    />

    <!-- Shield Body -->
    <path
      d="M100 18 C135 18 175 26 175 26 C175 26 178 112 100 224 C22 112 25 26 25 26 C25 26 65 18 100 18 Z"
      fill="url(#logoDarkInterior)"
      stroke="url(#logoSilverOutline)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Inner Line -->
    <path
      d="M100 27 C130 27 165 34 165 34 C165 34 167 106 100 208 C33 106 35 34 35 34 C35 34 70 27 100 27 Z"
      fill="none"
      stroke="#64748b"
      stroke-width="1.2"
      stroke-opacity="0.4"
    />

    <!-- Network Lines -->
    <g stroke="#10b981" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round">
      <line x1="100" y1="60" x2="142" y2="82" />
      <line x1="142" y1="82" x2="152" y2="130" />
      <line x1="152" y1="130" x2="130" y2="175" />
      <line x1="130" y1="175" x2="100" y2="196" />
      <line x1="100" y1="196" x2="70" y2="175" />
      <line x1="70" y1="175" x2="48" y2="130" />
      <line x1="48" y1="130" x2="58" y2="82" />
      <line x1="58" y1="82" x2="100" y2="60" />

      <line x1="100" y1="60" x2="100" y2="118" stroke-width="2.2" stroke-opacity="0.8" />
      <line x1="58" y1="82" x2="100" y2="118" stroke-width="2" stroke-opacity="0.75" />
      <line x1="142" y1="82" x2="100" y2="118" stroke-width="2" stroke-opacity="0.75" />
      <line x1="48" y1="130" x2="100" y2="118" stroke-width="2" stroke-opacity="0.75" />
      <line x1="152" y1="130" x2="100" y2="118" stroke-width="2" stroke-opacity="0.75" />
      <line x1="70" y1="175" x2="100" y2="118" stroke-width="2" stroke-opacity="0.75" />
      <line x1="130" y1="175" x2="100" y2="118" stroke-width="2" stroke-opacity="0.75" />
      <line x1="100" y1="196" x2="100" y2="118" stroke-width="2.2" stroke-opacity="0.8" />
    </g>

    <!-- Nodes -->
    <g fill="#10b981" filter="url(#logoMintGlow)">
      <circle cx="100" cy="60" r="5.5" fill="#34d399" />
      <circle cx="142" cy="82" r="5" fill="#34d399" />
      <circle cx="152" cy="130" r="4.5" />
      <circle cx="130" cy="175" r="4.5" />
      <circle cx="100" cy="196" r="4" fill="#059669" />
      <circle cx="70" cy="175" r="4.5" />
      <circle cx="48" cy="130" r="4.5" />
      <circle cx="58" cy="82" r="5" fill="#34d399" />
    </g>

    <!-- Cores -->
    <g fill="#ffffff">
      <circle cx="100" cy="60" r="2" />
      <circle cx="142" cy="82" r="1.8" />
      <circle cx="152" cy="130" r="1.5" />
      <circle cx="130" cy="175" r="1.5" />
      <circle cx="100" cy="196" r="1.4" />
      <circle cx="70" cy="175" r="1.5" />
      <circle cx="48" cy="130" r="1.5" />
      <circle cx="58" cy="82" r="1.8" />
    </g>

    <!-- Central Node -->
    <circle cx="100" cy="118" r="18" fill="#10b981" opacity="0.2" filter="url(#logoCenterGlow)" />
    <circle cx="100" cy="118" r="11" fill="#059669" opacity="0.4" />
    <circle cx="100" cy="118" r="8" fill="#10b981" filter="url(#logoMintGlow)" />
    <circle cx="100" cy="118" r="4" fill="#34d399" />
    <circle cx="100" cy="118" r="2" fill="#ffffff" />
  </g>

  <!-- Right: Typography -->
  <text x="180" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
    <tspan fill="#f8fafc">Threat</tspan><tspan fill="#10b981">Ledger</tspan>
  </text>
  <text x="184" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="4">
    CYBER THREAT INTELLIGENCE
  </text>
</svg>
